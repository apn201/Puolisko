<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Puolisko</title>
  <meta name="description" content="One half beautiful, one half monstrous. The skin AI judges both.">
  <meta name="theme-color" content="#120a1c">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="moon" aria-hidden="true"></div>
  <div class="night" aria-hidden="true"><div class="bat b1"><svg viewBox="0 0 64 30"><path d="M32 9L29 4L28 10C22 5 12 3 2 6C6 9 8 13 8 18C11 15 15 15 17 18C19 16 23 16 25 20C27 19 29 21 32 26C35 21 37 19 39 20C41 16 45 16 47 18C49 15 53 15 56 18C56 13 58 9 62 6C52 3 42 5 36 10L35 4Z"/></svg></div><div class="bat b2"><svg viewBox="0 0 64 30"><path d="M32 9L29 4L28 10C22 5 12 3 2 6C6 9 8 13 8 18C11 15 15 15 17 18C19 16 23 16 25 20C27 19 29 21 32 26C35 21 37 19 39 20C41 16 45 16 47 18C49 15 53 15 56 18C56 13 58 9 62 6C52 3 42 5 36 10L35 4Z"/></svg></div><div class="bat b3"><svg viewBox="0 0 64 30"><path d="M32 9L29 4L28 10C22 5 12 3 2 6C6 9 8 13 8 18C11 15 15 15 17 18C19 16 23 16 25 20C27 19 29 21 32 26C35 21 37 19 39 20C41 16 45 16 47 18C49 15 53 15 56 18C56 13 58 9 62 6C52 3 42 5 36 10L35 4Z"/></svg></div><div class="fog"></div></div>

  <header class="top">
    <a href="#home" class="brand" aria-label="Puolisko home">
      <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><circle cx="16" cy="16" r="13" class="logo-a"/><path d="M16 3a13 13 0 0 1 0 26z" class="logo-b"/><circle cx="16" cy="16" r="13" class="logo-seam"/><path class="logo-seam" d="M16 3v26M13 9h6M13 14h6M13 19h6M13 24h6"/></svg>
      Puolisko
    </a>
    <nav><a href="#privacy">Privacy</a><a href="#settings">Settings</a></nav>
  </header>

  <div id="banner" class="banner" hidden></div>
  <main id="view" tabindex="-1"></main>

  <!-- ============ screens ============ -->

  <template id="t-home">
    <section class="hero">
      <div class="hero-art" aria-hidden="true">
        <svg viewBox="0 0 220 260">
          <defs>
            <clipPath id="half-l"><rect x="0" y="0" width="110" height="260"/></clipPath>
            <clipPath id="half-r"><rect x="110" y="0" width="110" height="260"/></clipPath>
            <radialGradient id="skin-a" cx=".3" cy=".3" r=".9"><stop offset="0" stop-color="#fff0f7"/><stop offset="1" stop-color="#ffb0d8"/></radialGradient>
            <radialGradient id="skin-b" cx=".7" cy=".3" r=".9"><stop offset="0" stop-color="#ccff85"/><stop offset="1" stop-color="#4aa31c"/></radialGradient>
          </defs>
          <g class="spider">
            <line x1="192" y1="-14" x2="192" y2="30" stroke="#d8c8ef" stroke-width="1.2"/>
            <path d="M186 34q-8-6-12 2M186 38q-9-2-12 6M186 42q-7 2-9 10M198 34q8-6 12 2M198 38q9-2 12 6M198 42q7 2 9 10" stroke="#07030c" stroke-width="2.2" fill="none" stroke-linecap="round"/>
            <ellipse cx="192" cy="38" rx="7" ry="8" fill="#07030c"/>
            <circle cx="189.5" cy="40" r="1.4" fill="#ff7a1a"/><circle cx="194.5" cy="40" r="1.4" fill="#ff7a1a"/>
          </g>
          <rect x="183" y="149" width="16" height="12" rx="2" fill="#9aa3ad" stroke="#07030c" stroke-width="2.5"/>
          <rect x="197" y="145" width="8" height="20" rx="2" fill="#c3cad1" stroke="#07030c" stroke-width="2.5"/>
          <ellipse cx="110" cy="130" rx="80" ry="100" fill="url(#skin-a)" clip-path="url(#half-l)"/>
          <ellipse cx="110" cy="130" rx="80" ry="100" fill="url(#skin-b)" clip-path="url(#half-r)"/>
          <!-- beauty -->
          <path d="M44 70l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#fff"/>
          <path d="M40 166l2 4 4 2-4 2-2 4-2-4-4-2 4-2z" fill="#fff" opacity=".8"/>
          <path d="M50 96q20-12 44-2" stroke="#5a2340" stroke-width="4" fill="none" stroke-linecap="round"/>
          <path d="M54 118q21-20 42 0q-21-8-42 0z" fill="#ff7ad9" opacity=".85"/>
          <path d="M54 118q21 14 42 0" stroke="#1a0b22" stroke-width="3.5" fill="none" stroke-linecap="round"/>
          <path d="M60 123l-4 8M68 126l-2 8M76 127v8M84 126l2 8M91 122l4 7" stroke="#1a0b22" stroke-width="2.4" stroke-linecap="round"/>
          <ellipse cx="66" cy="154" rx="16" ry="10" fill="#ff5fa8" opacity=".45"/>
          <path d="M110 182q-8-6-14-3q-6-2-14 7q12 14 28 14z" fill="#ff2f86" stroke="#07030c" stroke-width="2.5" stroke-linejoin="round"/>
          <ellipse cx="96" cy="192" rx="5" ry="2" fill="#fff" opacity=".6"/>
          <!-- beast -->
          <g fill="#2f7a12" opacity=".55"><circle cx="160" cy="80" r="7"/><circle cx="174" cy="128" r="4"/><circle cx="132" cy="210" r="4"/><circle cx="148" cy="60" r="4"/></g>
          <circle cx="147" cy="118" r="22" fill="#24470f" opacity=".7"/>
          <g class="wink">
            <circle cx="147" cy="118" r="15" fill="#ffe14a" stroke="#07030c" stroke-width="3"/>
            <path d="M134 113l5 2M135 124l5-2M160 112l-5 3M159 126l-4-3" stroke="#ff3b5c" stroke-width="1.6" stroke-linecap="round"/>
            <ellipse cx="147" cy="118" rx="3.5" ry="11" fill="#07030c"/>
          </g>
          <path d="M124 94l46-10" stroke="#07030c" stroke-width="6" stroke-linecap="round"/>
          <path d="M124 160q22-10 48-4" stroke="#2a1018" stroke-width="3" fill="none"/>
          <path d="M130 151l4 12M142 148l3 12M154 147l2 12M165 150l1 12" stroke="#2a1018" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M110 182q10-6 18-2q8-2 12 5q-14 15-30 15z" fill="#3b1450" stroke="#07030c" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M118 187h7l-3.5 11z" fill="#fff" stroke="#07030c" stroke-width="1.5" stroke-linejoin="round"/>
          <!-- outline, seam, goo -->
          <ellipse cx="110" cy="130" rx="80" ry="100" fill="none" stroke="#07030c" stroke-width="4"/>
          <path d="M112 229q20-2 40-16c3 10 3 23-3 25-5 2-6-8-7-15-4 5-6 18-11 20-6 2-6-10-6-14-4 3-8 3-13 3z" fill="#7ed638" stroke="#07030c" stroke-width="2.5" stroke-linejoin="round"/>
          <line x1="110" y1="30" x2="110" y2="230" stroke="#07030c" stroke-width="3"/>
          <path d="M103 46h14M103 66h14M103 86h14M103 106h14M103 126h14M103 146h14M103 166h14M103 214h14" stroke="#07030c" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>
      <h1><span class="pretty">One half beautiful.</span> <span class="ugly">One half monstrous.</span></h1>
      <p class="lede">The skin AI judges both. The bigger the gap, the better.</p>
      <ol class="steps">
        <li><b>Bare face scan.</b> We measure your natural left/right difference, so nobody wins on genetics.</li>
        <li><b>Coin flip.</b> The app picks your Beauty side and your Beast side.</li>
        <li><b>Makeup bag.</b> Glam one half. Ghoul the other.</li>
        <li><b>Final scan.</b> The AI sees everything you did. Your score is the gap.</li>
      </ol>
      <a class="btn primary big" href="#start" data-f="start">Start</a>
      <a class="btn ghost" href="#result" data-f="last" hidden>Last result</a>
      <p class="small muted">Each scan uses the YouCam AI Skin Analysis API.</p>
    </section>
  </template>

  <template id="t-privacy">
    <section class="card stack">
      <h1>Before the first scan</h1>
      <ul class="facts">
        <li>Your photo goes to the YouCam API for scoring and nowhere else.</li>
        <li>We do not store it. Only the numbers stay, and only on your phone.</li>
        <li>YouCam keeps the result for up to 24 hours on their side.</li>
        <li>Sharing is your decision. We never post anything.</li>
      </ul>
      <div class="warn-box">
        <b>Makeup only.</b> Eyeliner, lipstick, eyeshadow, concealer, face paint made for skin.
        Nothing that stings, burns or was not made for faces. Not toothpaste.
      </div>
      <p class="small muted">Puolisko only ever scores the face of the person holding the phone. It never compares you with anyone or identifies anyone.</p>
      <button class="btn primary" data-f="ok">Got it</button>
    </section>
  </template>

  <template id="t-capture">
    <section class="capture">
      <h1 class="cap-title" data-f="title"></h1>
      <div class="viewfinder">
        <video playsinline muted autoplay></video>
        <svg class="guide" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <ellipse cx="150" cy="190" rx="104" ry="138" class="oval"/>
          <line x1="150" y1="30" x2="150" y2="370" class="mid"/>
          <line x1="150" y1="30" x2="150" y2="370" class="stitch"/>
          <text x="40" y="385" class="lbl" data-f="lblL"></text>
          <text x="260" y="385" class="lbl" data-f="lblR" text-anchor="end"></text>
        </svg>
        <div class="light" data-f="light"></div>
      </div>
      <p class="small center muted">Face fills the oval, nose on the line. Hair off the forehead, no glasses.</p>
      <div class="row center">
        <label class="btn ghost">Use a photo<input type="file" accept="image/jpeg,image/png" hidden data-f="file"></label>
        <button class="btn primary shutter" data-f="shoot">Scan · 9 units</button>
      </div>
    </section>
  </template>

  <template id="t-scanning">
    <section class="scanning">
      <div class="scan-img"><canvas data-f="canvas"></canvas><div class="sweep"></div></div>
      <p class="status big-status" data-f="status" role="status">Sending to YouCam</p>
      <p class="small muted" data-f="quip"></p>
      <div class="row center" data-f="retry" hidden>
        <a class="btn" data-f="back" href="#home">Back</a>
        <button class="btn primary" data-f="again">Try another photo</button>
      </div>
    </section>
  </template>

  <template id="t-coin">
    <section class="coin-screen">
      <p class="muted">Baseline saved. Your natural difference: <b data-f="offset"></b> points.</p>
      <div class="coin" data-f="coin"><span class="face-a">BEAUTY</span><span class="face-b">BEAST</span></div>
      <h1 data-f="verdict">Flipping…</h1>
      <div class="sides" data-f="sides" hidden>
        <div class="side-card beauty">
          <h2>Beauty · <span data-f="beautyCheek"></span> side</h2>
          <p>Concealer, foundation, highlighter. Even it out, hide the shadows, glow.</p>
        </div>
        <div class="side-card beast">
          <h2>Beast · <span data-f="beastCheek"></span> side</h2>
          <p>Eyeliner wrinkles. Red lipstick blotches. Dark eyeshadow under the eye. Brown dots.</p>
        </div>
        <p class="small muted">Sides are as you see yourself in a mirror. Keep the midline clean. Makeup only.</p>
        <a class="btn primary big" href="#final">I'm a monster. Scan me.</a>
      </div>
    </section>
  </template>

  <template id="t-result">
    <section class="result">
      <p class="eyebrow" data-f="title"></p>
      <div class="gap"><span class="gap-label">GAP</span><span class="gap-num" data-f="gap"></span></div>
      <div class="scores">
        <div class="score" data-f="scoreL"><span class="name"></span><span class="num"></span></div>
        <div class="score" data-f="scoreR"><span class="name"></span><span class="num"></span></div>
      </div>
      <p class="small muted center" data-f="offsetNote"></p>
      <div class="heat-wrap" data-f="heatWrap">
        <canvas data-f="heat"></canvas>
        <span class="tag-l" data-f="tagL"></span><span class="tag-r" data-f="tagR"></span>
      </div>
      <div class="legend small" data-f="legend"></div>
      <div class="row center" data-f="shareRow">
        <button class="btn primary big" data-f="share">Share</button>
      </div>
      <div class="row center small">
        <label class="chip"><input type="radio" name="fmt" value="feed" checked> Feed</label>
        <label class="chip"><input type="radio" name="fmt" value="story"> Story</label>
        <label class="chip"><input type="checkbox" data-f="shy"> Heatmap only, no face</label>
      </div>
      <p class="small muted center" data-f="shareNote"></p>
      <section class="card">
        <h2>What the AI saw</h2>
        <table class="breakdown" data-f="breakdown"></table>
      </section>
      <div class="row center">
        <a class="btn" href="#final">Rescan the monster</a>
        <a class="btn ghost" href="#start">New game</a>
      </div>
      <p class="small center"><button class="link" data-f="copy">Copy the numbers</button> <span class="muted">(scores only, no photo, for the developer)</span></p>
    </section>
  </template>

  <template id="t-settings">
    <section class="card stack">
      <h1>Settings</h1>
      <label data-f="codeWrap">Access code
        <input type="password" data-f="code" autocomplete="off" placeholder="from the submission page">
      </label>
      <p class="small muted" data-f="codeHelp">The public demo asks for a code so the scan budget lasts through judging.</p>
      <button class="btn danger" data-f="wipe">Delete my numbers</button>
      <p class="small muted">Diagnostics: <a href="lab.html">Lab</a> tests what makeup the AI picks up.</p>
    </section>
  </template>

  <script type="module" src="js/app.js"></script>
</body>
</html>
